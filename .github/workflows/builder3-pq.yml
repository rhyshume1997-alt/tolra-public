name: Builder 3 disposable PQ proof
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [codex/review-base-9b63382e]
    paths:
      - tests/pq/**
      - .github/workflows/builder3-pq.yml
permissions:
  contents: read
  packages: read
concurrency:
  group: builder3-pq-${{ github.head_ref }}
  cancel-in-progress: false
jobs:
  synthetic-pq:
    if: github.head_ref == 'codex/disposable-pq-151' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Keep disposable ports separate
        run: |
          reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${reserved:+$reserved,}55320-55329"
      - name: Install Code's exact checksum-pinned Supabase CLI
        run: |
          set -euo pipefail
          cli_dir="$RUNNER_TEMP/builder3-pq-cli"
          mkdir -p "$cli_dir"
          curl -fsSL -o "$cli_dir/cli.tar.gz" https://github.com/supabase/cli/releases/download/v2.40.7/supabase_linux_amd64.tar.gz
          echo "21dccbcecb9d2ffff4e48ed953539fe223b23becf13e0213a30c2d9a4054d258  $cli_dir/cli.tar.gz" | sha256sum -c -
          tar -xzf "$cli_dir/cli.tar.gz" -C "$cli_dir" supabase
          echo "568db201105cf8c261226fc16ab412ecc3b7bd03f25ea657852127a638b1601c  $cli_dir/supabase" | sha256sum -c -
          test "$("$cli_dir/supabase" --version)" = '2.40.7'
          echo "$cli_dir" >> "$GITHUB_PATH"
      - name: Registry read access for test images only
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Test reset and endpoint isolation guards
        run: node --test tests/pq/safety.test.mjs
      - name: Start and seed the owned real Supabase through 151
        run: node tests/pq/pq.mjs prepare
      - name: Install screenshot browser
        run: npx playwright install --with-deps chromium
      - name: Open real PQ pages in Chrome
        run: npx playwright test -c tests/pq/playwright.config.ts --reporter=list,json
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: tests/pq/results/browser.json
      - name: Require executed screenshot proof
        if: always()
        run: node scripts/ci-evidence.mjs playwright tests/pq/results/browser.json 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-pq-${{ github.run_id }}
          path: |
            tests/pq/screenshots/*.png
            tests/pq/results/browser.json
            tests/pq/.runtime/receipt.json
            tests/pq/.runtime/blocked-network.log
          retention-days: 7
      - name: Delete only this job's disposable PQ stack
        if: always()
        run: node tests/pq/pq.mjs stop
