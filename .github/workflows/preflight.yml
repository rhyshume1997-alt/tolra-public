  H_aggregate:
    name: 'H aggregate: one failure report'
    runs-on: ubuntu-latest
    needs:
    - A_chain_rehearsal_146
    - B_db_suite
    - C_build_install
    - D_browser_suite
    - E_reviewer_specs
    - F_xero_security
    - G_audit_sequencing
    if: ${{ always() }}
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
    - name: Job results and failed steps
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        NEEDS: ${{ toJSON(needs) }}
        RUN_ID: ${{ github.run_id }}
        REPO: ${{ github.repository }}
      run: |-
        echo "## Preflight aggregate for ${GITHUB_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"
        echo "$NEEDS" | jq -r 'to_entries[] | "| \(.key) | \(.value.result) |"' | tee -a "$GITHUB_STEP_SUMMARY"
        gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '.jobs[] | select(.conclusion=="failure" or .conclusion=="skipped" or .conclusion=="cancelled") | .name as $j | (.steps[]? | select(.conclusion=="failure" or .conclusion=="skipped") | "\($j) :: \(.name) :: \(.conclusion)")' | tee -a "$GITHUB_STEP_SUMMARY" || true
