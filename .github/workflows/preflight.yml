        loop = re.findall(r'"(\d{3}_[a-z_]+)\|([a-z_]+_\d{3})\|(post-144 marker \d{3} [a-z_]+)"', ci)
        print('fixture', [n for n, *_ in fixture]); print('ci loop', [r[0][:3] for r in loop])
        bad = []
        if [n for n, *_ in fixture] != [r[0][:3] for r in loop]: bad.append('fixture vs CI loop order differs')
        for (n, marker, f), (rel, ver, m) in zip(fixture, loop):
            if marker != m or not f.endswith(rel + '.release.sql'): bad.append(f'{n}: fixture {marker} {f} vs loop {m} {rel}')
            import os
            for p in (f, f'supabase/verify/{ver}.sql', f'supabase/release/{rel}.rollback.sql'):
                if not os.path.exists(p): bad.append(f'missing {p}')
        plan_txt = json.dumps(plan)
        for n, marker, f in fixture:
            if f not in plan_txt or marker not in plan_txt: bad.append(f'{n}: not in release-plan.json')
        print('MISMATCHES:', bad or 'none'); sys.exit(1 if bad else 0)
        PY
