name: Builder3 PRELIMINARY cbff safety verification
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - claude/second-candidate
permissions:
  contents: read
  packages: read
concurrency:
  group: builder3-cbff-safety-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false
jobs:
  sql:
    if: ${{ !cancelled() && github.head_ref == 'codex/cbff-safety-verification' && github.event.pull_request.head.repo.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Exact candidate inputs unchanged
      run: 'git merge-base --is-ancestor cbff130342145884fca10d2fb227f4888ac53ea3 HEAD

        git diff --exit-code cbff130342145884fca10d2fb227f4888ac53ea3 -- app components lib supabase scripts tests/support tests/e2e tests/rehearsal
        ''*.config.ts''

        mkdir -p evidence/builder3

        git rev-parse HEAD > evidence/builder3/source-sha.txt

        printf ''%s\n'' ''cbff130342145884fca10d2fb227f4888ac53ea3'' > evidence/builder3/candidate-sha.txt'
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Keep disposable ports separate
      run: 'reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)

        sudo sysctl -w net.ipv4.ip_local_reserved_ports="${reserved:+$reserved,}54320-54329"

        '
    - name: Install Code's exact checksum-pinned Supabase CLI
      run: 'set -euo pipefail

        cli_dir="$RUNNER_TEMP/builder3-supabase-cli"

        mkdir -p "$cli_dir"

        curl -fsSL -o "$cli_dir/cli.tar.gz" https://github.com/supabase/cli/releases/download/v2.40.7/supabase_linux_amd64.tar.gz

        echo "21dccbcecb9d2ffff4e48ed953539fe223b23becf13e0213a30c2d9a4054d258  $cli_dir/cli.tar.gz" | sha256sum -c -

        tar -xzf "$cli_dir/cli.tar.gz" -C "$cli_dir" supabase

        echo "568db201105cf8c261226fc16ab412ecc3b7bd03f25ea657852127a638b1601c  $cli_dir/supabase" | sha256sum -c -

        test "$("$cli_dir/supabase" --version)" = ''2.40.7''

        echo "$cli_dir" >> "$GITHUB_PATH"

        '
    - name: Registry read access for test images only
      run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Start real isolated Supabase
      run: npm run test:backend
    - name: Export this job disposable test environment exactly as candidate CI
      run: "python3 - <<'PY_ENV'\nimport os\nfrom pathlib import Path\nallowed = {\"TEST_SUPABASE_URL\", \"TEST_SUPABASE_ANON_KEY\", \"TEST_SUPABASE_SERVICE_ROLE_KEY\"\
        , \"TEST_DATABASE_URL\"}\nrows = [line for line in Path(\".env.test.local\").read_text().splitlines() if line.partition(\"=\")[0] in allowed]\n\
        if {line.partition(\"=\")[0] for line in rows} != allowed:\n    raise SystemExit(\"Disposable backend environment is incomplete; stop.\"\
        )\nwith open(os.environ[\"GITHUB_ENV\"], \"a\") as target:\n    target.write(\"\\n\".join(rows) + \"\\n\")\nPY_ENV"
    - name: P0-1 four real marker states, unchanged preflight
      id: marker
      continue-on-error: true
      run: NODE_OPTIONS="--require $GITHUB_WORKSPACE/tests/support/no-network.cjs" node tests/reviews/pm-four-hour/marker-107.mjs
    - name: Reset only this disposable backend to unchanged baseline
      run: npm run test:backend:reset
    - name: Full candidate database suite and PM regressions
      id: database
      continue-on-error: true
      timeout-minutes: 30
      run: CI_EVIDENCE_DB_JSON=evidence/db.json NODE_OPTIONS="--require $GITHUB_WORKSPACE/tests/support/no-network.cjs" E2E_BLOCKED_LOG="$GITHUB_WORKSPACE/evidence/builder3/db-outbound-attempts.log"
        npm run test:db
    - name: Full units
      id: units
      continue-on-error: true
      run: npx vitest run --reporter=default --reporter=json --outputFile.json=evidence/units.json
    - name: Typecheck
      id: typecheck
      continue-on-error: true
      run: npx tsc --noEmit
    - name: Lint
      id: lint
      continue-on-error: true
      run: npm run lint
    - name: Diff check
      id: diff
      continue-on-error: true
      run: git diff --check cbff130342145884fca10d2fb227f4888ac53ea3
    - name: Record every outcome, no green from skipped work
      if: always()
      env:
        OUTCOMES: ${{ toJSON(steps) }}
      run: 'node - <<''JS''

        const fs=require(''node:fs''); const s=JSON.parse(process.env.OUTCOMES); const r={status:''PRELIMINARY'',candidate:''cbff130342145884fca10d2fb227f4888ac53ea3'',outcomes:{}};for(const
        k of [''marker'',''database'',''units'',''typecheck'',''lint'',''diff''])r.outcomes[k]=s[k]?.outcome??''NOT RUN'';fs.mkdirSync(''evidence/builder3'',{recursive:true});fs.writeFileSync(''evidence/builder3/summary.json'',JSON.stringify(r,null,2));console.log(r);if(Object.values(r.outcomes).some(x=>x!==''success''))process.exitCode=1;

        JS'
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: builder3-cbff-safety-${{ github.run_id }}
        path: evidence/
        retention-days: 7
    - name: Stop only this disposable backend
      if: always()
      run: npm run test:backend:stop
