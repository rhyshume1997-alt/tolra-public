# CI. Which jobs run, and when (this saves Actions minutes; when in doubt, everything runs):
#
#   * The workflow always starts (no paths-ignore), so every check always reports: a skipped job counts as passed for
#     required status checks, so nothing here can leave a pull request waiting.
#   * The small "changes" job reads git diff (the pull request's merge base to its head, or the push's previous commit
#     to its new one) and decides:
#       - `web` and `costing-engine` are skipped when every changed file is under docs/ or is a *.md file.
#       - `integration` (disposable Supabase, database suite, upgrade rehearsal, browser suite: the slow one) is also
#         skipped when every changed file is under tests/live/ (the manual live-tenant checks, which no CI job runs).
#   * Everything runs whenever it can't be sure: the first push of a branch, a force push whose old commit is gone, an
#     empty or failed diff, or the "changes" job itself failing. Any other changed file (code, migrations, tests, this
#     file) runs everything.
#   * Once per commit, not twice: it runs on `push` only for main, and on `pull_request` for every branch. A feature
#     branch with an open pull request is checked by the pull request run alone (a push to a branch without a pull
#     request is not checked until one is opened). The "changes" job handles both events, as before.
#   * `integration` is the slow one (about 22 minutes), so on a pull request it runs only once the PR carries the
#     `ready` label: adding the label starts a run, and every later push to a labelled PR runs it too. It always runs
#     on main and on a manual run (Actions > CI > Run workflow). The quick checks (`web`: typecheck, lint, unit tests,
#     build; `costing-engine`) still run on every push. `ci-gate` (the one required check) stays red on a pull request
#     whose code changed until integration has run and passed, so `ready` is required before merging.
name: CI

# Public repository: the workflow token is read-only for every job (no job writes to the repo, issues or checks).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      specs:
        description: "Browser spec files to run instead of the whole suite (space-separated, e.g. tests/e2e/walkthrough.spec.ts). Empty = everything."
        required: false
        default: ""
      skip_db:
        description: "With specs: skip the database suite and the upgrade rehearsal (a targeted browser run, ~15 min)."
        required: false
        default: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out whether the slow `integration` job is needed (see the rules at the top). Only actions/checkout is used.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Succeeds (exit 0) only when the list of changed files could be worked out (into CHANGED). Any doubt returns 1,
          # which means "run everything".
          list_changes() {
            if [ "$EVENT" = "pull_request" ]; then
              base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"; range="$base...$head"
            else
              base="$PUSH_BEFORE"; head="$GITHUB_SHA"; range="$base..$head"
              case "$base" in
                ""|0000000000000000000000000000000000000000) echo "No previous commit (new branch): running everything."; return 1 ;;
              esac
            fi
            git cat-file -e "$base^{commit}" 2>/dev/null || { echo "Base commit $base is not available: running everything."; return 1; }
            git cat-file -e "$head^{commit}" 2>/dev/null || { echo "Head commit $head is not available: running everything."; return 1; }
            changed="$(git diff --name-only --no-renames "$range")" || { echo "git diff failed: running everything."; return 1; }
            [ -n "$changed" ] || { echo "No changed files listed: running everything."; return 1; }
            CHANGED="$changed"
            return 0
          }
          CHANGED=""
          if list_changes; then
            echo "Changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
            if echo "$CHANGED" | grep -qvE '^(tests/live/|docs/)|\.md$'; then integration=true; else integration=false; fi
          else
            code=true; integration=true
          fi
          echo "web and costing-engine: $code; integration: $integration"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint app components lib
      - name: Unit tests
        run: npm test
      - name: Browser suite collection (no backend or credentials needed)
        run: npm run test:e2e:list
      - name: Build
        run: npm run build
      - name: Public bundle carries no original fixture content (audit SEC12)
        run: npm run check:bundle
      - name: "Dependency audit, production packages (gate: fails on high or critical; audit B9)"
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit, all packages (report only)
        run: npm audit --audit-level=critical || true

  # Database and browser suites against a disposable local Supabase (audit B1). Docker on the runner only: no
  # hosted project, secret or production URL is involved, and the isolation guard refuses anything non-local.
  integration:
    needs: changes
    # On a pull request, only with the `ready` label (see the top). Otherwise skipped (counts as passed) only when
    # "changes" says so; if it failed or said anything else, run.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready')) && (needs.changes.result != 'success' || needs.changes.outputs.integration != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Raised from 60 with Rhys's OK, 15 Oct 2026 (runs reached 58 min), and from 90 with Rhys's OK, 22 Oct 2026 (PR 1's run was cancelled at 90 min with 7 browser tests left). Flag it if runs approach 120; do not raise silently.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - name: Start disposable Supabase (applies supabase/migrations to an empty database)
        run: npm run test:backend
      - name: Database suite (catalogue, migration chain, two-tenant RLS and role matrix)
        # A targeted manual run (workflow_dispatch with `specs` and skip_db=true) skips this and the rehearsal; every other run keeps them.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.specs != '' && inputs.skip_db == 'true') }}
        run: npm run test:db
      - name: "Upgrade rehearsal: 013 with imported data -> latest, twice, same catalogue as fresh (audit B10, SEC13)"
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.specs != '' && inputs.skip_db == 'true') }}
        run: scripts/upgrade-rehearsal.sh 013
      - name: Build against the disposable backend
        run: |
          set -a; . ./.env.test.local; set +a
          NEXT_PUBLIC_SUPABASE_URL="$TEST_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY" npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser suite
        # A manual run may name spec files (`specs`): only those run, in the same disposable stack. Empty = the whole suite.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.specs }}" ]; then
            npx playwright test ${{ inputs.specs }}
          else
            npm run test:e2e
          fi
        env:
          E2E_SKIP_BUILD: "1"
      - name: Keep run evidence (backend identity, failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            test-results/
            !test-results/e2e-state/world.json
          if-no-files-found: ignore
      - name: Stop disposable Supabase
        if: always()
        run: npm run test:backend:stop

  costing-engine:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: costing_smoke
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: services/costing-engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/costing-engine/requirements.txt
      - run: pip install -r requirements.txt
      - name: Compile
        run: python -m compileall app
      - name: HTTP smoke (auth, tenancy, calculations) against a throwaway database
        run: |
          pip install httpx
          python tests/http_smoke.py . postgresql+psycopg2://postgres:postgres@127.0.0.1:5432/costing_smoke smoke.json
      - name: Dependency audit (gate; audit B9)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  # The one check to require in branch protection. A skipped job counts as passed, so requiring the jobs above directly
  # would let a pull request merge with a job skipped for the wrong reason. This job always runs and passes only when
  # web and costing-engine passed (or were skipped because only docs changed) and integration passed, or was skipped
  # because only docs or tests/live changed. A code change without the `ready` label fails it: add `ready` to merge.
  ci-gate:
    # A targeted manual run (workflow_dispatch with `specs`) reports under another check name, so it can never stand in for the
    # required `ci-gate` on a commit: it is diagnostic only, and merge approval still needs the full pull-request run.
    name: ${{ (github.event_name == 'workflow_dispatch' && inputs.specs != '') && 'targeted-run (diagnostic, not a gate)' || 'ci-gate' }}
    needs: [changes, web, integration, costing-engine]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          READY: ${{ contains(github.event.pull_request.labels.*.name, 'ready') }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          INTEGRATION_NEEDED: ${{ needs.changes.outputs.integration }}
          WEB: ${{ needs.web.result }}
          COSTING: ${{ needs.costing-engine.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "event=$EVENT ready=$READY changes=$CHANGES code=$CODE integration_needed=$INTEGRATION_NEEDED"
          echo "web=$WEB costing-engine=$COSTING integration=$INTEGRATION"
          fail=0
          docs_only=false; [ "$CHANGES" = success ] && [ "$CODE" = false ] && docs_only=true
          for job in "web:$WEB" "costing-engine:$COSTING"; do
            name="${job%%:*}"; result="${job#*:}"
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$docs_only" = true ]; }; then
              echo "OK: $name $result"
            else
              echo "FAIL: $name $result"; fail=1
            fi
          done
          if [ "$INTEGRATION" = success ]; then
            echo "OK: integration passed"
          elif [ "$INTEGRATION" = skipped ] && [ "$CHANGES" = success ] && [ "$INTEGRATION_NEEDED" = false ]; then
            echo "OK: integration skipped (only docs or tests/live changed)"
          elif [ "$INTEGRATION" = skipped ] && [ "$EVENT" = pull_request ] && [ "$READY" != true ]; then
            echo "WAITING: code changed but the full integration suite hasn't run. Add the ready label to run it; this check passes once it does."; fail=1
          else
            echo "FAIL: integration $INTEGRATION"; fail=1
          fi
          exit $fail
