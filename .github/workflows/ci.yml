# CI. Which jobs run, and when (this saves Actions minutes; when in doubt, everything runs):
#
#   * The workflow always starts (no paths-ignore), so every check always reports: a skipped job counts as passed for
#     required status checks, so nothing here can leave a pull request waiting.
#   * The small "changes" job reads git diff (the pull request's merge base to its head, or the push's previous commit
#     to its new one) and decides:
#       - `web` is skipped when every changed file is under docs/ or is a *.md file.
#       - `integration` (disposable Supabase, database suite, upgrade rehearsal, browser suite: the slow one) is also
#         skipped when every changed file is under tests/live/ (the manual live-tenant checks, which no CI job runs).
#   * Everything runs whenever it can't be sure: the first push of a branch, a force push whose old commit is gone, an
#     empty or failed diff, or the "changes" job itself failing. Any other changed file (code, migrations, tests, this
#     file) runs everything. supabase/applied-migrations.json and scripts/check-migrations.mjs are code, not docs (the
#     `web` job's migration check reads them).
#   * Once per commit, not twice: it runs on `push` only for main, and on `pull_request` for every branch. A feature
#     branch with an open pull request is checked by the pull request run alone (a push to a branch without a pull
#     request is not checked until one is opened). The "changes" job handles both events, as before.
#   * `integration` is the slow one (about 22 minutes), so on a pull request it runs only once the PR carries the
#     `ready` label: adding the label starts a run, and every later push to a labelled PR runs it too. It always runs
#     on main and on a manual run (Actions > CI > Run workflow). The quick checks (`web`: typecheck, lint, unit tests,
#     build) still run on every push. `ci-gate` (the one required check) stays red on a pull request
#     whose code changed until integration has run and passed, so `ready` is required before merging.
#   * `guardrails` (pull requests only, a few seconds): scripts/check-test-weakening.mjs compares tests/ at the pull request's head
#     with its merge base. A deleted test file, a new .skip / .only, fewer test cases in a file or a raised page-size ceiling fails
#     it, and `ci-gate` with it. No label or setting lets a finding through: an intended removal needs Rhys himself. It fails
#     closed: if the comparison can't be made, it fails.
name: CI

# Public repository: the workflow token is read-only for every job (no job writes to the repo, issues or checks).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      specs:
        description: "Browser spec files to run instead of the whole suite (space-separated, e.g. tests/e2e/walkthrough.spec.ts). Empty = everything."
        required: false
        default: ""
      skip_db:
        description: "With specs: skip the database suite and the upgrade rehearsal (a targeted browser run, ~15 min)."
        required: false
        default: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out whether the slow `integration` job is needed (see the rules at the top). Only actions/checkout is used.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Succeeds (exit 0) only when the list of changed files could be worked out (into CHANGED). Any doubt returns 1,
          # which means "run everything".
          list_changes() {
            if [ "$EVENT" = "pull_request" ]; then
              base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"; range="$base...$head"
            else
              base="$PUSH_BEFORE"; head="$GITHUB_SHA"; range="$base..$head"
              case "$base" in
                ""|0000000000000000000000000000000000000000) echo "No previous commit (new branch): running everything."; return 1 ;;
              esac
            fi
            git cat-file -e "$base^{commit}" 2>/dev/null || { echo "Base commit $base is not available: running everything."; return 1; }
            git cat-file -e "$head^{commit}" 2>/dev/null || { echo "Head commit $head is not available: running everything."; return 1; }
            changed="$(git diff --name-only --no-renames "$range")" || { echo "git diff failed: running everything."; return 1; }
            [ -n "$changed" ] || { echo "No changed files listed: running everything."; return 1; }
            CHANGED="$changed"
            return 0
          }
          CHANGED=""
          if list_changes; then
            echo "Changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
            if echo "$CHANGED" | grep -qvE '^(tests/live/|docs/)|\.md$'; then integration=true; else integration=false; fi
          else
            code=true; integration=true
          fi
          echo "web: $code; integration: $integration"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Applied migrations frozen; new migrations ship release, verify, rollback and preflight marker
        run: npm run check:migrations
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint app components lib
      - name: Unit tests
        run: npm test
      - name: Browser suite collection (no backend or credentials needed)
        run: npm run test:e2e:list
      - name: Build
        run: npm run build
      - name: Public bundle carries no original fixture content (audit SEC12)
        run: npm run check:bundle
      - name: "Dependency audit, production packages (gate: fails on high or critical; audit B9)"
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit, all packages (report only)
        run: npm audit --audit-level=critical || true

  # Database and browser suites against a disposable local Supabase (audit B1). Docker on the runner only: no
  # hosted project, secret or production URL is involved, and the isolation guard refuses anything non-local.
  integration:
    needs: changes
    # On a pull request, only with the `ready` label (see the top). Otherwise skipped (counts as passed) only when
    # "changes" says so; if it failed or said anything else, run.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready')) && (needs.changes.result != 'success' || needs.changes.outputs.integration != 'false') }}
    runs-on: ubuntu-24.04
    # Three shards of the browser suite, one runner each (own VM, own Docker, own Supabase on 54321-54324, own database: nothing is shared).
    # Shard 1 also runs everything that is not the browser suite (Financial143 proof, database suite, upgrade rehearsal, the ten reviewer specs,
    # diagnostics, diff audit), exactly once. `ci-gate` needs `integration`, which is green only when every shard instance is green.
    # A targeted manual run (`specs`) uses one instance and no --shard.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.specs != '' && '[1]' || '[1,2,3]') }}
    name: integration (shard ${{ matrix.shard }})
    timeout-minutes: 120  # Raised from 60 with Rhys's OK, 15 Oct 2026 (runs reached 58 min), and from 90 with Rhys's OK, 22 Oct 2026 (PR 1's run was cancelled at 90 min with 7 browser tests left). Flag it if runs approach 120; do not raise silently.
    # The test-backend helper explicitly selects the official ghcr.io images. Anonymous pulls were
    # rate-limited on 26 Oct 2026 (HTTP 429, runs 40360101636 and 40367638716; public.ecr.aws then refused anonymous pulls
    # with "Data limit exceeded", run 40384629882), so this job signs in to ghcr.io with its own token, read-only.
    permissions:
      contents: read
      packages: read
    steps:
      # Linux hands out 32768-60999 as source ports for outgoing connections, and Supabase listens on 54320-54324, so an
      # outgoing connection (npm ci, the cache, image pulls) could hold one first: "failed to bind host port ... address
      # already in use" (26 Oct 2026, runs 40378990100 and 40319104185). Reserve 54320-54329 before anything else runs so the
      # kernel never picks them; Supabase's own binds still work. Existing reservations are kept. Fails the job if the
      # reservation does not take.
      - name: Keep the Supabase ports out of the outgoing-connection range
        run: |
          current=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${current:+$current,}54320-54329"
          python3 - <<'PY'
          import sys
          s = open("/proc/sys/net/ipv4/ip_local_reserved_ports").read().strip()
          reserved = set()
          for part in filter(None, s.split(",")):
              lo, _, hi = part.partition("-")
              reserved.update(range(int(lo), int(hi or lo) + 1))
          missing = [p for p in range(54320, 54330) if p not in reserved]
          print("reserved ports now:", s)
          sys.exit(f"not reserved: {missing}" if missing else 0)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The CLI this suite has always run on. 143 now quotes save_costing_settings_atomic, so 2.40.7 (which misreads an unquoted
      # name ending in _atomic as BEGIN ATOMIC, 42601) splits it correctly. 2.108.0 starts a stack whose service_role lacks the
      # default grants these tests rely on (runs 42065110388 and 42091337997: 119 database files fail on assert_privileged_aal).
      # Pinned by checksum, not only by version: the tarball must match the sha256 published in the release's own
      # supabase_2.40.7_checksums.txt (21dccbce...), and the installed binary must report 2.40.7. No fallback to another version.
      - name: Install Supabase CLI 2.40.7 (checksum-verified)
        run: |
          set -euo pipefail
          cli_home="$RUNNER_TEMP/supabase-cli-main"
          mkdir -p "$cli_home/bin"
          curl -fsSL -o "$cli_home/cli.tar.gz" https://github.com/supabase/cli/releases/download/v2.40.7/supabase_linux_amd64.tar.gz
          echo "21dccbcecb9d2ffff4e48ed953539fe223b23becf13e0213a30c2d9a4054d258  $cli_home/cli.tar.gz" | sha256sum -c -
          tar -xzf "$cli_home/cli.tar.gz" -C "$cli_home/bin" supabase
          test "$("$cli_home/bin/supabase" --version)" = "2.40.7"
          echo "$cli_home/bin" >> "$GITHUB_PATH"
      # Supabase images saved by an earlier run (cache key: CLI version + supabase/config.toml). A hit loads them so `supabase start` skips the
      # pulls; a miss changes nothing (the pulls below still work and the images are saved for the next run).
      - name: Cache Supabase Docker images
        id: supabase-images
        uses: actions/cache@v4
        with:
          path: ~/supabase-images
          key: supabase-images-2.40.7-${{ hashFiles('supabase/config.toml') }}
      - name: Load cached Supabase Docker images
        if: ${{ steps.supabase-images.outputs.cache-hit == 'true' }}
        run: for f in "$HOME"/supabase-images/*.tar; do docker load -i "$f"; done
      # Signed-in pulls from ghcr.io (see `permissions` above): the job's own token, read-only, passed on stdin, never printed.
      - name: Sign in to ghcr.io for the Supabase image pulls
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The reservation stops new allocations but cannot free a port already held, so check the ports Supabase binds
      # (api 54321, db 54322, mail 54324: supabase/config.toml) are free right before it starts, and name any that are not.
      - name: Supabase ports are free
        run: |
          python3 - <<'PY'
          import socket, sys
          busy = []
          for port in (54321, 54322, 54324):
              s = socket.socket()
              try:
                  s.bind(("0.0.0.0", port))
              except OSError as e:
                  busy.append(f"{port}: {e}")
              finally:
                  s.close()
          print("busy:", busy or "none")
          sys.exit("Supabase ports already in use: " + "; ".join(busy) if busy else 0)
          PY
      - name: Financial143 CLI, rate snapshots and company isolation (own disposable database)
        if: ${{ matrix.shard == 1 }}
        run: |
          git fetch --no-tags --depth=1 origin e42d927383513d1b98ce9cfca444884475622e2f
          docker pull postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
          # This proof needs the OLD parser (CLI 2.40.7); the job's own `supabase` is the same release. The test itself refuses any binary whose
          # sha256 is not 568db201105cf8c261226fc16ab412ecc3b7bd03f25ea657852127a638b1601c (2.40.7, linux amd64).
          cli_dir="$RUNNER_TEMP/supabase-cli-2.40.7"
          mkdir -p "$cli_dir"
          curl -fsSL -o "$cli_dir/cli.tar.gz" https://github.com/supabase/cli/releases/download/v2.40.7/supabase_linux_amd64.tar.gz
          tar -xzf "$cli_dir/cli.tar.gz" -C "$cli_dir" supabase
          B5_SUPABASE_CLI="$cli_dir/supabase" npx vitest run -c tests/reviews/b5-financial/vitest.config.ts
      - name: Start disposable Supabase (applies supabase/migrations to an empty database)
        run: npm run test:backend
      - name: Save Supabase Docker images for the cache
        if: ${{ steps.supabase-images.outputs.cache-hit != 'true' }}
        continue-on-error: true
        run: |
          mkdir -p "$HOME/supabase-images"
          docker images --format '{{.Repository}}:{{.Tag}}' | grep '^ghcr.io/supabase/' | while read -r img; do
            docker save -o "$HOME/supabase-images/$(echo "$img" | tr '/:' '__').tar" "$img"
          done
      - name: Export this job's disposable test environment
        run: |
          python3 - <<'PY_ENV'
          import os
          from pathlib import Path
          allowed = {"TEST_SUPABASE_URL", "TEST_SUPABASE_ANON_KEY", "TEST_SUPABASE_SERVICE_ROLE_KEY", "TEST_DATABASE_URL"}
          rows = [line for line in Path(".env.test.local").read_text().splitlines() if line.partition("=")[0] in allowed]
          if {line.partition("=")[0] for line in rows} != allowed:
              raise SystemExit("Disposable backend environment is incomplete; stop.")
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write("\n".join(rows) + "\n")
          PY_ENV
      # Evidence for the release 159 / storage.objects question (informational, never gates, never changes anything): which login ran the baseline
      # migrations that `supabase start` applied, and does it differ from the login the release fixture uses (TEST_DATABASE_URL)? A table's owner is the
      # login that created it, so the owners of the baseline's public tables and functions name the migration runner (a SET ROLE inside a migration would
      # hide it, which is why this is evidence and not proof of effective rights; the last column is the effective check). Catalog SELECTs only: no
      # pg_authid, no password, no connection string. The log lines are reduced to user names and counts by the filter below; nothing else is printed.
      - name: "Baseline runner evidence (informational, read-only: which login applied the baseline migrations, and does it differ from the release fixture's login)"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          set +e
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=0 -X <<'SQL'
          select 'fixture login (TEST_DATABASE_URL): name / superuser / bypassrls / canlogin' as check, r.rolname::text || ' / ' || r.rolsuper::text || ' / ' || r.rolbypassrls::text || ' / ' || r.rolcanlogin::text as value from pg_roles r where r.rolname = current_user
          union all select 'baseline public tables owned by ' || pg_get_userbyid(c.relowner), count(*)::text from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind in ('r','p') group by c.relowner
          union all select 'baseline public functions owned by ' || pg_get_userbyid(p.proowner), count(*)::text from pg_proc p where p.pronamespace = 'public'::regnamespace and not exists (select 1 from pg_depend d where d.objid = p.oid and d.deptype = 'e') group by p.proowner
          union all select 'owner of supabase_migrations.schema_migrations', coalesce((select pg_get_userbyid(c.relowner) from pg_class c where c.oid = to_regclass('supabase_migrations.schema_migrations')), 'not present')
          union all select 'baseline owner ' || r.rolname || ': superuser / bypassrls / canlogin / acts as the storage.objects owner', r.rolsuper::text || ' / ' || r.rolbypassrls::text || ' / ' || r.rolcanlogin::text || ' / ' || coalesce(pg_has_role(r.oid, so.relowner, 'USAGE')::text, 'n/a') from pg_roles r left join pg_class so on so.oid = to_regclass('storage.objects') where r.oid in (select c.relowner from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind in ('r','p'))
          union all select 'baseline runner is the same login as the fixture', case when exists (select 1 from pg_class c where c.relnamespace = 'public'::regnamespace and c.relkind in ('r','p') and pg_get_userbyid(c.relowner) <> current_user) then 'NO: some baseline tables are owned by another login' else 'yes: every baseline table is owned by the fixture login' end;
          SQL
          echo "== connection log: login names and counts only (no log line is printed) =="
          db_container="$(docker ps --format '{{.Names}}' 2>/dev/null | grep -m1 '^supabase_db_')"
          if [ -n "$db_container" ]; then
            docker logs "$db_container" 2>&1 | grep -F 'connection authorized' | sed -nE 's/.*user=([A-Za-z0-9_]+).*/\1/p' | sort | uniq -c
          fi
          echo "(no lines above means connection logging is off: inconclusive, not evidence of anything)"
          exit 0
      # Informational (never gates, never changes the database): which of release 159's two storage.objects statements this database refuses, with the
      # SQLSTATE and PostgreSQL source location. scripts/ci-statement-diagnostic.sh runs those two statements (verbatim) and a control inside a transaction
      # it always rolls back, then proves from two fresh sessions that the state is unchanged. Loopback disposable database only.
      # Residual risk, accepted for speed (it runs BEFORE the Database suite): a result of fingerprint CHANGED or UNVERIFIED, or ROLLBACK NOT CONFIRMED,
      # means this run's required results are void and must be reported as such. No lock is held past the 3-minute timeout.
      # The script's \warn markers need psql 13 or later (the runner's psql is 16).
      - name: "Statement diagnostic (informational, disposable database only: which release 159 statement is refused, SQLSTATE and source location; always rolled back, state verified unchanged)"
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 3
        run: bash scripts/ci-statement-diagnostic.sh
      - name: "Permission diagnostic (read-only, informational, who may run the privileged-aal check on this stack)"
        continue-on-error: true
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=0 -X <<'SQL'
          select version();
          select rolname, rolsuper, rolbypassrls, rolcanlogin from pg_roles where rolname in ('postgres','supabase_admin','authenticator','anon','authenticated','service_role') order by 1;
          select p.oid::regprocedure as fn, pg_get_userbyid(p.proowner) as owner, p.proacl::text as acl,
                 has_function_privilege('service_role', p.oid, 'execute') as service_role_can,
                 has_function_privilege('authenticated', p.oid, 'execute') as authenticated_can
            from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname in ('assert_privileged_aal','site_network_ip_purge','require_admin_mfa_guard') order by 1;
          select pg_get_userbyid(d.defaclrole) as for_role, d.defaclnamespace::regnamespace as in_schema, d.defaclobjtype as kind, d.defaclacl::text as acl from pg_default_acl d order by 1,2,3;
          select current_user, (select rolsuper from pg_roles where rolname = current_user) as is_superuser;
          show session_preload_libraries;
          show shared_preload_libraries;
          show dynamic_library_path;
          select r.rolname, s.setconfig::text from pg_db_role_setting s join pg_roles r on r.oid = s.setrole where r.rolname in ('authenticator','postgres','service_role','authenticated','anon');
          select grantee, privilege_type from information_schema.role_table_grants where table_schema = 'public' and table_name = 'organization_members' and grantee in ('service_role','authenticated','anon') order by 1,2;
          SQL
      - name: Database suite (catalogue, migration chain, two-tenant RLS and role matrix)
        # A targeted manual run (workflow_dispatch with `specs` and skip_db=true) skips this and the rehearsal; every other run keeps them.
        if: ${{ matrix.shard == 1 && (!(github.event_name == 'workflow_dispatch' && inputs.specs != '' && inputs.skip_db == 'true')) }}
        # Full command, no exclusions. The sequencer runs every baseline file first,
        # then all release proofs prepare/verify 145 to 170 on this disposable backend.
        # The baseline and upgrade rehearsal still test only numbered migrations first.
        # Post-144 release plan (supabase/release-plan.json): 145 N5, 146 N2/cap, 147 delivery note, 148 job costing, 149 Xero switch, 150 AI cap/key-off, 151 Xero invite hardening, 152 SliQ import route, 153 document customer links, 154 portal sign-in, 156 invoice number case, 157 jobs integrity guard (155 reserved), 158 machine run integrity, 159 job drawings overwrite refused, 160 legacy reopen_job closed to the browser; proofs remain mandatory.
        env:
          CI_EVIDENCE_DB_JSON: evidence/db.json
        run: npm run test:db
      - name: "Ownership diagnostic (informational, read-only SELECT, runs every time after the Database suite: who owns storage.objects, the current role, its role membership and privileges)"
        if: ${{ always() }}
        continue-on-error: true
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=0 -X <<'SQL'
          select 'storage.objects owner' as check, (select pg_get_userbyid(c.relowner) from pg_class c where c.oid = to_regclass('storage.objects')) as value
          union all select 'storage.objects acl', (select c.relacl::text from pg_class c where c.oid = to_regclass('storage.objects'))
          union all select 'storage.objects row security on', (select c.relrowsecurity::text from pg_class c where c.oid = to_regclass('storage.objects'))
          union all select 'current_user', current_user::text
          union all select 'session_user', session_user::text
          union all select 'current role is superuser / bypassrls', (select rolsuper::text || ' / ' || rolbypassrls::text from pg_roles where rolname = current_user)
          union all select 'current role is member of', (select string_agg(pg_get_userbyid(m.roleid), ', ' order by pg_get_userbyid(m.roleid)) from pg_auth_members m where m.member = (select oid from pg_roles where rolname = current_user))
          union all select 'current role is member of storage.objects owner (member / usage)', (select pg_has_role(current_user, c.relowner, 'MEMBER')::text || ' / ' || pg_has_role(current_user, c.relowner, 'USAGE')::text from pg_class c where c.oid = to_regclass('storage.objects'))
          union all select 'current role privileges on storage.objects (select/insert/update/delete/trigger)', (select concat_ws(' / ', has_table_privilege(current_user, c.oid, 'SELECT'), has_table_privilege(current_user, c.oid, 'INSERT'), has_table_privilege(current_user, c.oid, 'UPDATE'), has_table_privilege(current_user, c.oid, 'DELETE'), has_table_privilege(current_user, c.oid, 'TRIGGER')) from pg_class c where c.oid = to_regclass('storage.objects'))
          union all select 'storage.objects policies', (select string_agg(policyname, ', ' order by policyname) from pg_policies where schemaname = 'storage' and tablename = 'objects');
          SQL
      - name: "Evidence: stand-in sessions that could not LOAD pg-safeupdate (those sessions did NOT verify safeupdate enforcement)"
        if: ${{ matrix.shard == 1 && (always()) }}
        run: |
          f=evidence/safeupdate-sessions.log
          n=0; [ -f "$f" ] && n=$(wc -l < "$f")
          echo "SAFEUPDATE-NOT-LOADABLE affected stand-in sessions: $n"
          if [ "$n" -gt 0 ]; then
            echo "NOTE: in those e2/wa sessions the bare UPDATE/DELETE refusal was not exercised. Enforcement is proven only through the real API path by tests/db/safeupdate-api-path.test.ts (and the safeupdate-gated import suites where loadable)."
          fi
      - name: "Upgrade rehearsal: 013 with imported data -> latest, twice, same catalogue as fresh (audit B10, SEC13)"
        if: ${{ matrix.shard == 1 && (!(github.event_name == 'workflow_dispatch' && inputs.specs != '' && inputs.skip_db == 'true')) }}
        env:
          REHEARSAL_VITEST_ARGS: --reporter=verbose --reporter=json --outputFile.json=evidence/rehearsal.json
        run: scripts/upgrade-rehearsal.sh 013
      - name: "Evidence: database suite, skips, named cases, release refusals, rehearsal (labels computed from the real reports)"
        if: ${{ matrix.shard == 1 && (always() && hashFiles('evidence/db.json') != '') }}
        shell: bash
        run: |
          rc=0
          echo "== test:db, no exclusions =="
          node scripts/ci-evidence.mjs vitest-summary evidence/db.json DB-SUITE || rc=1
          node scripts/ci-evidence.mjs db-skips evidence/db.json || rc=1
          echo "== company setup isolation (release 145) =="
