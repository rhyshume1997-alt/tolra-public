# CI. Which jobs run, and when (this saves Actions minutes; when in doubt, everything runs):
#
#   * The workflow always starts (no paths-ignore), so every check always reports: a skipped job counts as passed for
#     required status checks, so nothing here can leave a pull request waiting.
#   * The small "changes" job reads git diff (the pull request's merge base to its head, or the push's previous commit
#     to its new one) and decides:
#       - `web` is skipped when every changed file is under docs/ or is a *.md file.
#       - `integration` (disposable Supabase, database suite, upgrade rehearsal, browser suite: the slow one) is also
#         skipped when every changed file is under tests/live/ (the manual live-tenant checks, which no CI job runs).
#   * Everything runs whenever it can't be sure: the first push of a branch, a force push whose old commit is gone, an
#     empty or failed diff, or the "changes" job itself failing. Any other changed file (code, migrations, tests, this
#     file) runs everything. supabase/applied-migrations.json and scripts/check-migrations.mjs are code, not docs (the
#     `web` job's migration check reads them).
#   * Once per commit, not twice: it runs on `push` only for main, and on `pull_request` for every branch. A feature
#     branch with an open pull request is checked by the pull request run alone (a push to a branch without a pull
#     request is not checked until one is opened). The "changes" job handles both events, as before.
#   * `integration` is the slow one (about 22 minutes), so on a pull request it runs only once the PR carries the
#     `ready` label: adding the label starts a run, and every later push to a labelled PR runs it too. It always runs
#     on main and on a manual run (Actions > CI > Run workflow). The quick checks (`web`: typecheck, lint, unit tests,
#     build) still run on every push. `ci-gate` (the one required check) stays red on a pull request
#     whose code changed until integration has run and passed, so `ready` is required before merging.
name: CI

# Public repository: the workflow token is read-only for every job (no job writes to the repo, issues or checks).
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      specs:
        description: "Browser spec files to run instead of the whole suite (space-separated, e.g. tests/e2e/walkthrough.spec.ts). Empty = everything."
        required: false
        default: ""
      skip_db:
        description: "With specs: skip the database suite and the upgrade rehearsal (a targeted browser run, ~15 min)."
        required: false
        default: "true"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Works out whether the slow `integration` job is needed (see the rules at the top). Only actions/checkout is used.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      integration: ${{ steps.diff.outputs.integration }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # Succeeds (exit 0) only when the list of changed files could be worked out (into CHANGED). Any doubt returns 1,
          # which means "run everything".
          list_changes() {
            if [ "$EVENT" = "pull_request" ]; then
              base="$PR_BASE_SHA"; head="$PR_HEAD_SHA"; range="$base...$head"
            else
              base="$PUSH_BEFORE"; head="$GITHUB_SHA"; range="$base..$head"
              case "$base" in
                ""|0000000000000000000000000000000000000000) echo "No previous commit (new branch): running everything."; return 1 ;;
              esac
            fi
            git cat-file -e "$base^{commit}" 2>/dev/null || { echo "Base commit $base is not available: running everything."; return 1; }
            git cat-file -e "$head^{commit}" 2>/dev/null || { echo "Head commit $head is not available: running everything."; return 1; }
            changed="$(git diff --name-only --no-renames "$range")" || { echo "git diff failed: running everything."; return 1; }
            [ -n "$changed" ] || { echo "No changed files listed: running everything."; return 1; }
            CHANGED="$changed"
            return 0
          }
          CHANGED=""
          if list_changes; then
            echo "Changed files:"; echo "$CHANGED"
            if echo "$CHANGED" | grep -qvE '^docs/|\.md$'; then code=true; else code=false; fi
            if echo "$CHANGED" | grep -qvE '^(tests/live/|docs/)|\.md$'; then integration=true; else integration=false; fi
          else
            code=true; integration=true
          fi
          echo "web: $code; integration: $integration"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "integration=$integration" >> "$GITHUB_OUTPUT"

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Applied migrations frozen; new migrations ship release, verify, rollback and preflight marker
        run: npm run check:migrations
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npx eslint app components lib
      - name: Unit tests
        run: npm test
      - name: Browser suite collection (no backend or credentials needed)
        run: npm run test:e2e:list
      - name: Build
        run: npm run build
      - name: Public bundle carries no original fixture content (audit SEC12)
        run: npm run check:bundle
      - name: "Dependency audit, production packages (gate: fails on high or critical; audit B9)"
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit, all packages (report only)
        run: npm audit --audit-level=critical || true

  # Database and browser suites against a disposable local Supabase (audit B1). Docker on the runner only: no
  # hosted project, secret or production URL is involved, and the isolation guard refuses anything non-local.
  integration:
    needs: changes
    # On a pull request, only with the `ready` label (see the top). Otherwise skipped (counts as passed) only when
    # "changes" says so; if it failed or said anything else, run.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ready')) && (needs.changes.result != 'success' || needs.changes.outputs.integration != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120  # Raised from 60 with Rhys's OK, 15 Oct 2026 (runs reached 58 min), and from 90 with Rhys's OK, 22 Oct 2026 (PR 1's run was cancelled at 90 min with 7 browser tests left). Flag it if runs approach 120; do not raise silently.
    # The test-backend helper explicitly selects the official ghcr.io images. Anonymous pulls were
    # rate-limited on 26 Oct 2026 (HTTP 429, runs 40360101636 and 40367638716; public.ecr.aws then refused anonymous pulls
    # with "Data limit exceeded", run 40384629882), so this job signs in to ghcr.io with its own token, read-only.
    permissions:
      contents: read
      packages: read
    steps:
      # Linux hands out 32768-60999 as source ports for outgoing connections, and Supabase listens on 54320-54324, so an
      # outgoing connection (npm ci, the cache, image pulls) could hold one first: "failed to bind host port ... address
      # already in use" (26 Oct 2026, runs 40378990100 and 40319104185). Reserve 54320-54329 before anything else runs so the
      # kernel never picks them; Supabase's own binds still work. Existing reservations are kept. Fails the job if the
      # reservation does not take.
      - name: Keep the Supabase ports out of the outgoing-connection range
        run: |
          current=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${current:+$current,}54320-54329"
          python3 - <<'PY'
          import sys
          s = open("/proc/sys/net/ipv4/ip_local_reserved_ports").read().strip()
          reserved = set()
          for part in filter(None, s.split(",")):
              lo, _, hi = part.partition("-")
              reserved.update(range(int(lo), int(hi or lo) + 1))
          missing = [p for p in range(54320, 54330) if p not in reserved]
          print("reserved ports now:", s)
          sys.exit(f"not reserved: {missing}" if missing else 0)
          PY
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 2.40.7 misreads names ending in _atomic as BEGIN ATOMIC and joins SQL statements (42601).
      # 2.108.0 fixes the parser boundary; numbered migrations stay unchanged.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      # Signed-in pulls from ghcr.io (see `permissions` above): the job's own token, read-only, passed on stdin, never printed.
      - name: Sign in to ghcr.io for the Supabase image pulls
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The reservation stops new allocations but cannot free a port already held, so check the ports Supabase binds
      # (api 54321, db 54322, mail 54324: supabase/config.toml) are free right before it starts, and name any that are not.
      - name: Supabase ports are free
        run: |
          python3 - <<'PY'
          import socket, sys
          busy = []
          for port in (54321, 54322, 54324):
              s = socket.socket()
              try:
                  s.bind(("0.0.0.0", port))
              except OSError as e:
                  busy.append(f"{port}: {e}")
              finally:
                  s.close()
          print("busy:", busy or "none")
          sys.exit("Supabase ports already in use: " + "; ".join(busy) if busy else 0)
          PY
      - name: Financial143 CLI, rate snapshots and company isolation (own disposable database)
        run: |
          git fetch --no-tags --depth=1 origin e42d927383513d1b98ce9cfca444884475622e2f
          docker pull postgres@sha256:3b0cda93be7c8dba2ed484d19393d93845dc3dafb88973e248ba8e6d99d784e1
          B5_SUPABASE_CLI="$(command -v supabase)" npx vitest run -c tests/reviews/b5-financial/vitest.config.ts
      - name: Start disposable Supabase (applies supabase/migrations to an empty database)
        run: npm run test:backend
      - name: Export this job's disposable test environment
        run: |
          python3 - <<'PY_ENV'
          import os
          from pathlib import Path
          allowed = {"TEST_SUPABASE_URL", "TEST_SUPABASE_ANON_KEY", "TEST_SUPABASE_SERVICE_ROLE_KEY", "TEST_DATABASE_URL"}
          rows = [line for line in Path(".env.test.local").read_text().splitlines() if line.partition("=")[0] in allowed]
          if {line.partition("=")[0] for line in rows} != allowed:
              raise SystemExit("Disposable backend environment is incomplete; stop.")
          with open(os.environ["GITHUB_ENV"], "a") as target:
              target.write("\n".join(rows) + "\n")
          PY_ENV
      - name: Database suite (catalogue, migration chain, two-tenant RLS and role matrix)
        # A targeted manual run (workflow_dispatch with `specs` and skip_db=true) skips this and the rehearsal; every other run keeps them.
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.specs != '' && inputs.skip_db == 'true') }}
        # Full command, no exclusions. The sequencer runs every baseline file first,
        # then all release proofs prepare/verify 145 and 146 on this disposable backend.
        # The baseline and upgrade rehearsal still test only numbered migrations first.
        # Post-144 release plan: 145 N5 then 146 N2/cap; proofs remain mandatory.
        env:
          CI_EVIDENCE_DB_JSON: evidence/db.json
        run: npm run test:db
      - name: "Upgrade rehearsal: 013 with imported data -> latest, twice, same catalogue as fresh (audit B10, SEC13)"
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.specs != '' && inputs.skip_db == 'true') }}
        env:
          REHEARSAL_VITEST_ARGS: --reporter=verbose --reporter=json --outputFile.json=evidence/rehearsal.json
        run: scripts/upgrade-rehearsal.sh 013
      - name: "Evidence: database suite, skips, named cases, release refusals, rehearsal (labels computed from the real reports)"
        if: ${{ always() && hashFiles('evidence/db.json') != '' }}
        shell: bash
        run: |
          rc=0
          echo "== test:db, no exclusions =="
          node scripts/ci-evidence.mjs vitest-summary evidence/db.json DB-SUITE || rc=1
          node scripts/ci-evidence.mjs db-skips evidence/db.json || rc=1
          echo "== company setup isolation (release 145) =="
          node scripts/ci-evidence.mjs source-tokens tests/db/company-setup-isolation.test.ts admin beta office workshop viewer "support" elevated outsider anon "toEqual(before" || true
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/company-setup-isolation.test.ts || rc=1
          echo "== Tolra-provided AI (release 146): key isolation, no fallback, owner controls, two-connection race, rollback refusal, second install =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/tolra-provided-ai.test.ts tests/db/tolra-ai-cap-concurrency.test.ts || rc=1
          echo "== no-order delivery note (release 147): role matrix, two companies, release gate, double submit race, rollback and re-release =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/job-delivery-note-147.test.ts tests/db/dln-day-of-counter.test.ts || rc=1
          echo "== Xero transfer switch (release 149): off by default, every send path refuses, reconnect resets, concurrency, isolation, rollback =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/xero-launch-hold-149.test.ts tests/db/xero-launch-paths-149.test.ts || rc=1
          echo "== AI cap 1000p and key change forces AI off (release 150): default, force-off, audit, in-flight, isolation, platform key, rollback and re-release on a populated database =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/ai-cap-key-off-150.test.ts || rc=1
          echo "== SliQ releases 140 and 141: isolation and preflight proofs =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/opening-wip-141-isolation.test.ts tests/db/sliq-import-preflight-140-141.test.ts || rc=1
          echo "== Costing rates (release 143, after 141 and before 144): no built-in rate, company scoping, roles, second step, stale refusal, serialised saves, all-or-nothing, past records unchanged =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/costing-rates-143.test.ts tests/db/costing-save-143.test.ts || rc=1
          echo "== #253 and #255 proofs =="
          node scripts/ci-evidence.mjs named evidence/db.json CASES tests/db/reviewer-inbound-conditions.test.ts tests/db/reviewer-chase-conditions.test.ts || rc=1
          exit $rc
      # Releases 145/146, their verification queries and extra refusal proofs are
      # owned by the ordered test:db fixture. Never apply these one-time files twice.
      - name: Build against the disposable backend
        run: |
          set -a; . ./.env.test.local; set +a
          NEXT_PUBLIC_SUPABASE_URL="$TEST_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY" npm run build
      # The upgrade rehearsal ends with `scripts/test-backend.sh reset`, which
      # rebuilds the disposable database from numbered migrations only, so the one-time releases 145, 146, 147 and 150 that the test:db fixture
      # installed are gone and the browser backend has no company_setup_progress / Tolra AI tables. Re-install them here the way
      # tests/support/post-144-release-fixture.ts does (preflight marker, release file, verify file with every row true, schema reload).
      # Loopback database only; each marker is checked first so a release file is never applied twice.
      - name: "Install one-time releases 145, 146, 147, 149 and 150 on the disposable database "
        run: |
          set -euo pipefail
          set -a; . ./.env.test.local; set +a
          case "$TEST_DATABASE_URL" in
            postgresql://*@127.0.0.1:*) ;;
            *) echo "Refusing: $TEST_DATABASE_URL is not the local disposable database" >&2; exit 1 ;;
          esac
          psql_q() { psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -At -F '|' "$@"; }
          for phase in "145_company_setup|company_setup_145|post-144 marker 145 company_setup" "146_tolra_provided_ai|tolra_provided_ai_146|post-144 marker 146 tolra_provided_ai" "147_job_delivery_note|job_delivery_note_147|post-144 marker 147 job_delivery_note" "149_xero_launch_hold|xero_launch_hold_149|post-144 marker 149 xero_launch_hold" "150_ai_cap_key_off|ai_cap_key_off_150|post-144 marker 150 ai_cap_key_off"; do
            IFS='|' read -r release verify marker <<< "$phase"
            state="$(psql_q -f supabase/verify/release_preflight.sql | awk -F'|' -v m="$marker" '$1==m {print $2}')"
            [ -n "$state" ] || { echo "Missing release preflight marker: $marker" >&2; exit 1; }
            if [ "$state" != "applied" ]; then
              psql_q -f "supabase/release/${release}.release.sql"
              state="$(psql_q -f supabase/verify/release_preflight.sql | awk -F'|' -v m="$marker" '$1==m {print $2}')"
              [ "$state" = "applied" ] || { echo "Release did not verify: $marker" >&2; exit 1; }
            fi
            rows="$(psql_q -f "supabase/verify/${verify}.sql")"
            [ -n "$rows" ] || { echo "Release verification returned no rows: $marker" >&2; exit 1; }
            if printf '%s\n' "$rows" | awk -F'|' '$NF != "t" {bad=1} END {exit !bad}'; then
              echo "Release verification failed: $marker" >&2; printf '%s\n' "$rows" >&2; exit 1
            fi
          done
          psql_q -c "NOTIFY pgrst, 'reload schema'"
          sleep 3
      - name: "Evidence: upgrade rehearsal 013 (catalogue compare, frozen security checks), real lines"
        if: ${{ always() && hashFiles('evidence/rehearsal.json') != '' }}
        shell: bash
        run: |
          node scripts/ci-evidence.mjs list-all evidence/rehearsal.json REHEARSAL '^D2'
          node scripts/ci-evidence.mjs vitest-summary evidence/rehearsal.json REHEARSAL
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: "SCHEMA MARKER before the browser tests (no reset since the 145/146/147/150 install step)"
        run: scripts/ci-schema-markers.sh
      - name: Browser suite
        # A manual run may name spec files (`specs`): only those run, in the same disposable stack. Empty = the whole suite.
        # The list comes in through SPECS, never pasted into the script (audit S4): split into words on spaces, with no globbing or
        # command substitution, and an entry that looks like an option is refused.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$SPECS" ]; then
            read -r -a spec_files <<< "$SPECS"
            for spec in "${spec_files[@]}"; do
              case "$spec" in -*) echo "specs: list spec files only, not options" >&2; exit 1 ;; esac
            done
            npx playwright test "${spec_files[@]}"
          else
            npm run test:e2e
          fi
        env:
          E2E_SKIP_BUILD: "1"
          SPECS: ${{ inputs.specs }}
      - name: "SCHEMA MARKER immediately before the reviewer specs"
        if: ${{ !cancelled() }}
        run: scripts/ci-schema-markers.sh
      - name: Reviewer browser conditions (all ten, database required)
        if: ${{ !cancelled() }}
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/reviewer.json
        run: REVIEWER_REQUIRE_DATABASE=1 E2E_SKIP_BUILD=1 npx playwright test -c playwright.reviewer.config.ts --reporter=list,json
      - name: Keep run evidence (backend identity, failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-evidence
          path: |
            test-results/
            evidence/
            !test-results/e2e-state/world.json
          if-no-files-found: ignore
      - name: "Evidence: reviewer specs (requires exactly 10 passed, 0 failed, 0 skipped)"
        if: ${{ always() && hashFiles('evidence/reviewer.json') != '' }}
        run: node scripts/ci-evidence.mjs playwright evidence/reviewer.json 10
      - name: "Evidence: reinstall after a 146 rollback (runs last, informational, then resets the disposable database)"
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: bash
        run: |
          set -a; . ./.env.test.local; set +a
          case "$TEST_DATABASE_URL" in postgresql://*@127.0.0.1:*) ;; *) echo "Refusing: not the local disposable database" >&2; exit 1 ;; esac
          reinstall=supabase/release/146_tolra_provided_ai.release.sql
          if psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -q -f supabase/release/146_tolra_provided_ai.rollback.sql > evidence/rollback146.log 2>&1; then
            echo "146 rollback accepted (no outstanding reservation)"
            if psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -X -q -f "$reinstall" > evidence/reinstall146.log 2>&1; then
              echo "FAIL reinstall of 146 after rollback was ACCEPTED without a reset"
            else
              echo "PASS reinstall of 146 after rollback was refused: $(grep -m1 -E 'ERROR' evidence/reinstall146.log)"
            fi
          else
            echo "INCONCLUSIVE 146 rollback refused: $(grep -m1 -E 'ERROR' evidence/rollback146.log)"
          fi
          scripts/test-backend.sh reset
      - name: "Diff audit against the approved baselines (findings printed, each explained in the evidence file)"
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git fetch --no-tags origin 41c685c416305637d86b580324fff9e6cda037ff 97811d301479d4e409b8eb89f0e7ff2bc61db7e6 f96087a58bf7dd9030e447e71a10b52ba54671d9 2b4bd18390efc468a01b449dae70c844ee204a05
          node scripts/ci-evidence.mjs diff-audit HEAD 41c685c416305637d86b580324fff9e6cda037ff 97811d301479d4e409b8eb89f0e7ff2bc61db7e6 f96087a58bf7dd9030e447e71a10b52ba54671d9 2b4bd18390efc468a01b449dae70c844ee204a05
      - name: Stop disposable Supabase
        if: always()
        run: npm run test:backend:stop

  # The one check to require in branch protection. A skipped job counts as passed, so requiring the jobs above directly
  # would let a pull request merge with a job skipped for the wrong reason. This job always runs and passes only when
  # web passed (or was skipped because only docs changed) and integration passed, or was skipped
  # because only docs or tests/live changed. A code change without the `ready` label fails it: add `ready` to merge.
  ci-gate:
    # A targeted manual run (workflow_dispatch with `specs`) reports under another check name, so it can never stand in for the
    # required `ci-gate` on a commit: it is diagnostic only, and merge approval still needs the full pull-request run.
    name: ${{ (github.event_name == 'workflow_dispatch' && inputs.specs != '') && 'targeted-run (diagnostic, not a gate)' || 'ci-gate' }}
    needs: [changes, web, integration]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          READY: ${{ contains(github.event.pull_request.labels.*.name, 'ready') }}
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          INTEGRATION_NEEDED: ${{ needs.changes.outputs.integration }}
          WEB: ${{ needs.web.result }}
          INTEGRATION: ${{ needs.integration.result }}
        run: |
          echo "event=$EVENT ready=$READY changes=$CHANGES code=$CODE integration_needed=$INTEGRATION_NEEDED"
          echo "web=$WEB integration=$INTEGRATION"
          fail=0
          docs_only=false; [ "$CHANGES" = success ] && [ "$CODE" = false ] && docs_only=true
          for job in "web:$WEB"; do
            name="${job%%:*}"; result="${job#*:}"
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$docs_only" = true ]; }; then
              echo "OK: $name $result"
            else
              echo "FAIL: $name $result"; fail=1
            fi
          done
          if [ "$INTEGRATION" = success ]; then
            echo "OK: integration passed"
          elif [ "$INTEGRATION" = skipped ] && [ "$CHANGES" = success ] && [ "$INTEGRATION_NEEDED" = false ]; then
            echo "OK: integration skipped (only docs or tests/live changed)"
          elif [ "$INTEGRATION" = skipped ] && [ "$EVENT" = pull_request ] && [ "$READY" != true ]; then
            echo "WAITING: code changed but the full integration suite hasn't run. Add the ready label to run it; this check passes once it does."; fail=1
          else
            echo "FAIL: integration $INTEGRATION"; fail=1
          fi
          exit $fail
