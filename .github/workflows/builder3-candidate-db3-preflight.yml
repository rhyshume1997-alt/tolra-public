        with open(os.environ["GITHUB_ENV"], "a") as target:
            target.write("\n".join(rows) + "\n")
        PY_ENV
    - name: Execute 145..151, verify, refuse duplicates, rollback, refuse146 reinstall, reset and compare reinstall hashes
      run: |-
        set -a; . ./.env.test.local; set +a
        node tests/reviews/builder3-candidate/chain.mjs "${{ matrix.profile }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: chain-${{ matrix.profile }}-${{ github.run_id }}
        path: |-
          evidence/
          test-results/
          !test-results/e2e-state/world.json
        retention-days: 3
    - name: Stop only this disposable backend
      if: always()
      run: npm run test:backend:stop
  remaining-preflight:
    needs:
    - reproduce-147
    - migration-chain
    if: ${{ !cancelled() && github.head_ref == 'codex/candidate-db3-preflight' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Exact candidate inputs unchanged
      run: |-
        git merge-base --is-ancestor db3c2aa5415570e4a3c755e1452d2c94bdc52c9b HEAD
        git diff --exit-code db3c2aa5415570e4a3c755e1452d2c94bdc52c9b -- app components lib supabase scripts tests/db tests/support tests/e2e tests/rehearsal '*.config.ts'
        mkdir -p evidence/builder3
        git rev-parse HEAD > evidence/builder3/source-sha.txt
        printf '%s\n' 'db3c2aa5415570e4a3c755e1452d2c94bdc52c9b' > evidence/builder3/candidate-sha.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Keep disposable ports separate
      run: |
        reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)
        sudo sysctl -w net.ipv4.ip_local_reserved_ports="${reserved:+$reserved,}54320-54329"
    - name: Install Code's exact checksum-pinned Supabase CLI
      run: |
        set -euo pipefail
        cli_dir="$RUNNER_TEMP/builder3-supabase-cli"
        mkdir -p "$cli_dir"
        curl -fsSL -o "$cli_dir/cli.tar.gz" https://github.com/supabase/cli/releases/download/v2.40.7/supabase_linux_amd64.tar.gz
        echo "21dccbcecb9d2ffff4e48ed953539fe223b23becf13e0213a30c2d9a4054d258  $cli_dir/cli.tar.gz" | sha256sum -c -
        tar -xzf "$cli_dir/cli.tar.gz" -C "$cli_dir" supabase
        echo "568db201105cf8c261226fc16ab412ecc3b7bd03f25ea657852127a638b1601c  $cli_dir/supabase" | sha256sum -c -
        test "$("$cli_dir/supabase" --version)" = '2.40.7'
        echo "$cli_dir" >> "$GITHUB_PATH"
    - name: Registry read access for test images only
      run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Start real isolated Supabase
      run: npm run test:backend
    - name: Export this job disposable test environment exactly as candidate CI
      run: |-
        python3 - <<'PY_ENV'
        import os
        from pathlib import Path
        allowed = {"TEST_SUPABASE_URL", "TEST_SUPABASE_ANON_KEY", "TEST_SUPABASE_SERVICE_ROLE_KEY", "TEST_DATABASE_URL"}
        rows = [line for line in Path(".env.test.local").read_text().splitlines() if line.partition("=")[0] in allowed]
        if {line.partition("=")[0] for line in rows} != allowed:
            raise SystemExit("Disposable backend environment is incomplete; stop.")
        with open(os.environ["GITHUB_ENV"], "a") as target:
            target.write("\n".join(rows) + "\n")
        PY_ENV
    - run: npx playwright install --with-deps chromium
    - name: Block new connections outside disposable services during browser proof
      run: |
        set -euo pipefail
        for firewall in iptables ip6tables; do
          sudo "$firewall" -N BUILDER3_BROWSER_EGRESS
          sudo "$firewall" -A BUILDER3_BROWSER_EGRESS -o lo -j RETURN
          sudo "$firewall" -A BUILDER3_BROWSER_EGRESS -m conntrack --ctstate ESTABLISHED,RELATED -j RETURN
        done
        # Published loopback ports can be DNATed onto this job's Supabase bridge.
        networks=$(docker inspect supabase_db_tolra-local-test --format '{{range $name, $config := .NetworkSettings.Networks}}{{$name}} {{end}}')
        test -n "$networks"
        for network in $networks; do
          while read -r subnet; do
            test -n "$subnet" || continue
            case "$subnet" in *:*) firewall=ip6tables ;; *) firewall=iptables ;; esac
            sudo "$firewall" -A BUILDER3_BROWSER_EGRESS -d "$subnet" -j RETURN
          done < <(docker network inspect "$network" --format '{{range .IPAM.Config}}{{println .Subnet}}{{end}}')
        done
        for firewall in iptables ip6tables; do
          sudo "$firewall" -A BUILDER3_BROWSER_EGRESS -j REJECT
          sudo "$firewall" -I OUTPUT 1 -j BUILDER3_BROWSER_EGRESS
        done
        # Reserved documentation address, never a provider. Kernel rejection must prevent a connection.
        python3 - <<'PYBLOCK'
        import socket
        try:
            socket.create_connection(("198.51.100.1", 443), timeout=2)
        except OSError:
            print("New external connections blocked for browser/backend proof")
        else:
            raise SystemExit("External egress unexpectedly available")
        PYBLOCK
    - name: All candidate database cases, including named Xero and release safeguards
      id: database
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |-
        mkdir -p evidence
        CI_EVIDENCE_DB_JSON=evidence/db.json npm run test:db
    - name: 'Step15: real013 upgrade rehearsal, resets back to full numbered baseline'
      id: rehearsal
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: REHEARSAL_VITEST_ARGS="--reporter=verbose --reporter=json --outputFile.json=evidence/rehearsal.json" scripts/upgrade-rehearsal.sh 013
    - name: 'Step16: exact database and named Xero evidence'
      id: named
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |-
        rc=0
        node scripts/ci-evidence.mjs vitest-summary evidence/db.json DATABASE || rc=1
        node scripts/ci-evidence.mjs named evidence/db.json XERO tests/db/xero-invite-151.test.ts tests/db/xero-invite-store-picker-151.test.ts tests/db/xero-151-permissions.test.ts tests/db/xero-invite-cancel-during-callback-151.test.ts tests/db/xero-invite-late-write-151.test.ts tests/db/release-order-guards.test.ts tests/db/rollback-data-refusal.test.ts tests/db/release-upgrade-populated-145-151.test.ts || rc=1
        exit "$rc"
    - name: 'Step17: build against disposable backend'
      id: build
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |-
        set -a; . ./.env.test.local; set +a
        NEXT_PUBLIC_SUPABASE_URL="$TEST_SUPABASE_URL" NEXT_PUBLIC_SUPABASE_ANON_KEY="$TEST_SUPABASE_ANON_KEY" npm run build
    - name: 'Step18: install and verify exact145..151 release files'
      id: install
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: |-
        set -a; . ./.env.test.local; set +a
        node tests/reviews/builder3-candidate/install.mjs
    - name: 'Step21: schema markers before browser'
      id: markers
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: scripts/ci-schema-markers.sh
    - name: Collect exact browser case count
      id: collection
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: npx playwright test --list --reporter=json > evidence/browser-collected.json
    - name: 'Step22: execute the entire candidate browser suite, without stopping at first failure'
      id: browser
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: npx playwright test --reporter=list,json
      env:
        E2E_SKIP_BUILD: '1'
        PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/browser.json
    - name: 'Step23: schema markers before reviewer'
      id: reviewer_markers
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: scripts/ci-schema-markers.sh
    - name: 'Step24: execute all ten reviewer browser cases with the real backend required'
      id: reviewer
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: REVIEWER_REQUIRE_DATABASE=1 E2E_SKIP_BUILD=1 npx playwright test -c playwright.reviewer.config.ts --reporter=list,json
      env:
        PLAYWRIGHT_JSON_OUTPUT_NAME: evidence/reviewer.json
    - name: 'Step26: require10reviewer passes, zero fail/skip/flaky'
      id: reviewer_evidence
      if: ${{ !cancelled() }}
      continue-on-error: true
      run: node scripts/ci-evidence.mjs playwright evidence/reviewer.json 10
    - name: Record and remove only this job's test egress rules
      if: always()
      run: |
        mkdir -p evidence
        for firewall in iptables ip6tables; do
          sudo "$firewall" -L BUILDER3_BROWSER_EGRESS -v -n >> evidence/invite-browser-egress.txt 2>&1 || true
          sudo "$firewall" -D OUTPUT -j BUILDER3_BROWSER_EGRESS 2>/dev/null || true
          sudo "$firewall" -F BUILDER3_BROWSER_EGRESS 2>/dev/null || true
          sudo "$firewall" -X BUILDER3_BROWSER_EGRESS 2>/dev/null || true
        done
    - name: Record every outcome and fail if any diagnostic failed
      if: always()
      env:
        DIAGNOSTIC_OUTCOMES: ${{ toJSON(steps) }}
      run: |-
        node - <<'JS'
        const fs=require('node:fs'); const outcomes=JSON.parse(process.env.DIAGNOSTIC_OUTCOMES);
        const result={status:'PRELIMINARY',candidateSha:'db3c2aa5415570e4a3c755e1452d2c94bdc52c9b',sourceSha:require('node:child_process').execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim(),steps:{},reports:{}};
        for(const id of ["collection", "database", "rehearsal", "named", "build", "install", "markers", "browser", "reviewer_markers", "reviewer", "reviewer_evidence"]) result.steps[id]=outcomes[id]?.outcome??'NOT RUN';
        for(const name of ['db','rehearsal','browser','reviewer']) {try {const r=JSON.parse(fs.readFileSync(`evidence/${name}.json`));result.reports[name]=r.stats??{passed:r.numPassedTests,failed:r.numFailedTests,skipped:r.numPendingTests,total:r.numTotalTests};} catch {result.reports[name]='NOT RUN';}}
        fs.mkdirSync('evidence/builder3',{recursive:true}); fs.writeFileSync('evidence/builder3/preflight.json',JSON.stringify(result,null,2)); console.log(result);
        const b=result.reports.browser; const count=ss=>ss.reduce((n,s)=>n+(s.specs??[]).reduce((m,p)=>m+p.tests.length,0)+count(s.suites??[]),0);result.requiredBrowser=null; try {result.requiredBrowser=count(JSON.parse(fs.readFileSync('evidence/browser-collected.json')).suites)} catch {}
        if(!Number.isInteger(result.requiredBrowser)||result.requiredBrowser<1||!b||typeof b!=='object'||b.expected!==result.requiredBrowser||b.unexpected||b.skipped||b.flaky)process.exitCode=1;
        fs.writeFileSync('evidence/builder3/preflight.json',JSON.stringify(result,null,2));
        if(Object.values(result.steps).some(x=>x!=='success'))process.exitCode=1;
        JS
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: candidate-preflight-${{ github.run_id }}
        path: |-
          evidence/
          test-results/
          !test-results/e2e-state/world.json
        retention-days: 3
    - name: Stop only this disposable backend
      if: always()
      run: npm run test:backend:stop
