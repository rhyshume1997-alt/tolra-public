name: Builder3 PRELIMINARY db3c2aa5 independent preflight
'on':
  pull_request:
    types:
    - opened
    - synchronize
    - reopened
    branches:
    - claude/final-candidate
permissions:
  contents: read
  packages: read
concurrency:
  group: builder3-candidate-db3-${{ github.head_ref }}
  cancel-in-progress: false
jobs:
  reproduce-147:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant:
        - original
        - corrected
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      SUPABASE_INTERNAL_IMAGE_REGISTRY: ghcr.io
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
    - name: Exact candidate inputs unchanged
      run: |-
        git merge-base --is-ancestor db3c2aa5415570e4a3c755e1452d2c94bdc52c9b HEAD
        git diff --exit-code db3c2aa5415570e4a3c755e1452d2c94bdc52c9b -- app components lib supabase scripts tests/db tests/support tests/e2e tests/rehearsal '*.config.ts'
        mkdir -p evidence/builder3
        git rev-parse HEAD > evidence/builder3/source-sha.txt
        printf '%s\n' 'db3c2aa5415570e4a3c755e1452d2c94bdc52c9b' > evidence/builder3/candidate-sha.txt
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - run: npm ci
    - name: Keep disposable ports separate
      run: |
        reserved=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)
        sudo sysctl -w net.ipv4.ip_local_reserved_ports="${reserved:+$reserved,}54320-54329"
    - name: Install Code's exact checksum-pinned Supabase CLI
      run: |
        set -euo pipefail
        cli_dir="$RUNNER_TEMP/builder3-supabase-cli"
        mkdir -p "$cli_dir"
        curl -fsSL -o "$cli_dir/cli.tar.gz" https://github.com/supabase/cli/releases/download/v2.40.7/supabase_linux_amd64.tar.gz
        echo "21dccbcecb9d2ffff4e48ed953539fe223b23becf13e0213a30c2d9a4054d258  $cli_dir/cli.tar.gz" | sha256sum -c -
        tar -xzf "$cli_dir/cli.tar.gz" -C "$cli_dir" supabase
        echo "568db201105cf8c261226fc16ab412ecc3b7bd03f25ea657852127a638b1601c  $cli_dir/supabase" | sha256sum -c -
        test "$("$cli_dir/supabase" --version)" = '2.40.7'
        echo "$cli_dir" >> "$GITHUB_PATH"
    - name: Registry read access for test images only
      run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
      env:
        GHCR_USER: ${{ github.actor }}
        GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Start real isolated Supabase
      run: npm run test:backend
    - name: Export this job disposable test environment exactly as candidate CI
      run: |-
        python3 - <<'PY_ENV'
        import os
        from pathlib import Path
        allowed = {"TEST_SUPABASE_URL", "TEST_SUPABASE_ANON_KEY", "TEST_SUPABASE_SERVICE_ROLE_KEY", "TEST_DATABASE_URL"}
        rows = [line for line in Path(".env.test.local").read_text().splitlines() if line.partition("=")[0] in allowed]
        if {line.partition("=")[0] for line in rows} != allowed:
            raise SystemExit("Disposable backend environment is incomplete; stop.")
        with open(os.environ["GITHUB_ENV"], "a") as target:
            target.write("\n".join(rows) + "\n")
        PY_ENV
    - name: Run the exact original or corrected 147 file against an empty install
      run: |-
        set -a; . ./.env.test.local; set +a
        node tests/reviews/builder3-candidate/reproduce147.mjs "${{ matrix.variant }}"
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: 147-${{ matrix.variant }}-${{ github.run_id }}
        path: |-
          evidence/
          test-results/
          !test-results/e2e-state/world.json
        retention-days: 3
    - name: Stop only this disposable backend
      if: always()
      run: npm run test:backend:stop
    if: ${{ !cancelled() && github.head_ref == 'codex/candidate-db3-preflight' && github.event.pull_request.head.repo.full_name == github.repository }}
