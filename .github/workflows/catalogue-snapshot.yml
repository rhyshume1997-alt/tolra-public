# Diagnostic only (never merge): regenerates tests/db/catalogue.snapshot.json on the disposable local database and prints the diff,
# so the reviewed snapshot can be updated for migration 144 by hand. Loopback database only; nothing is committed or pushed by CI.
name: Catalogue snapshot diff (diagnostic)

on:
  push:
    branches: [claude/221-catalogue-snapshot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Keep the Supabase ports out of the outgoing-connection range
        run: |
          current=$(cat /proc/sys/net/ipv4/ip_local_reserved_ports)
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="${current:+$current,}54320-54329"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.40.7
      - name: Sign in to ghcr.io for the Supabase image pulls
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USER" --password-stdin
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start disposable Supabase
        run: npm run test:backend
      - name: Regenerate the catalogue snapshot and print the diff
        run: |
          set -a; . ./.env.test.local; set +a
          case "$TEST_DATABASE_URL" in postgresql://*@127.0.0.1:*) ;; *) echo "Refusing: not a loopback database" >&2; exit 1 ;; esac
          UPDATE_CATALOGUE=1 npx vitest run -c vitest.db.config.ts tests/db/catalogue.test.ts
          echo "=====SNAPSHOT-DIFF-BEGIN"
          git diff --unified=1 -- tests/db/catalogue.snapshot.json
          echo "=====SNAPSHOT-DIFF-END"
      - name: Stop disposable Supabase
        if: always()
        run: npm run test:backend:stop
